<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<!-- Font -->
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:'Nunito', sans-serif;
    background:linear-gradient(135deg,#f5e6d3,#ead7c3);
    position:relative;
}

/* Clock */
.clock{
    font-size:90px;
    color:#6d4c41;
    text-shadow:0 5px 15px rgba(0,0,0,0.1);
    animation:float 3s ease-in-out infinite;
}

/* Message */
.message{
    margin-top:20px;
    color:#6d4c41;
    font-size:35px;
    opacity:0;
    transition:1s;
}

/* Candle */
.candle{
    margin-top:30px;
    position:relative;
    width:25px;
    height:80px;
    background:white;
    border-radius:10px;
}

/* Flame */
.flame{
    position:absolute;
    top:-30px;
    left:50%;
    transform:translateX(-50%);
    width:25px;
    height:35px;
    background:orange;
    border-radius:50%;
    box-shadow:0 0 20px yellow;
    animation:flicker 0.2s infinite;
}

/* Final Text */
.finalText{
    position:absolute;
    font-size:95px;
    color:#6d4c41;
    opacity:0;
    text-shadow:0 5px 15px rgba(0,0,0,0.1);
    animation:float 3s ease-in-out infinite;
}

/* Balloons */
.balloon{
    position:absolute;
    bottom:-150px;
    width:70px;
    height:90px;
    background:#8b5e3c;
    border-radius:50%;
    animation:fly linear forwards;
}

/* Balloon String */
.balloon::after{
    content:'';
    position:absolute;
    width:2px;
    height:70px;
    background:#e8d5c4;
    left:50%;
    top:90px;
    transform:translateX(-50%);
}

/* Balloon Animation */
@keyframes fly{

    from{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }

    to{
        transform:translateY(-120vh) rotate(15deg);
        opacity:1;
    }
}

/* Flame Animation */
@keyframes flicker{

    0%{
        transform:translateX(-50%) scale(1);
    }

    50%{
        transform:translateX(-50%) scale(1.1);
    }

    100%{
        transform:translateX(-50%) scale(1);
    }
}

/* Floating */
@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

</style>
</head>

<body>

<!-- Clock -->
<div class="clock" id="clock">23:59</div>

<!-- Message -->
<div class="message" id="message">
    Blow the candle 🎂
</div>

<!-- Candle -->
<div class="candle" id="candle">
    <div class="flame" id="flame"></div>
</div>

<!-- Final Text -->
<div class="finalText" id="finalText">
    Happy Birthday 🎉
</div>

<!-- Music -->
<audio id="song">
    <source src="happybirthday.mp3" type="audio/mpeg">
</audio>

<script>

// Show message
setTimeout(()=>{

    document.getElementById('message').style.opacity='1';

},1000);


// Click anywhere
document.body.addEventListener('click',()=>{

    // Turn off flame
    document.getElementById('flame').style.display='none';

    setTimeout(()=>{

        // Change time
        document.getElementById('clock').innerHTML='00:00';

        // Hide old elements
        document.getElementById('clock').style.opacity='0';
        document.getElementById('message').style.opacity='0';
        document.getElementById('candle').style.opacity='0';

        // Show birthday text
        document.getElementById('finalText').style.opacity='1';

        // Create balloons
        for(let i = 0; i < 25; i++) {

            let balloon = document.createElement("div");

            balloon.className = "balloon";

            balloon.style.left =
                Math.random() * 100 + "vw";

            balloon.style.animationDuration =
                (5 + Math.random() * 5) + "s";

            document.body.appendChild(balloon);
        }

        // Play music
        document.getElementById('song').play();

    },1500);

});

</script>

</body>
</html>
